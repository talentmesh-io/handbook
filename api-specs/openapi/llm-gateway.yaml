openapi: 3.0.3
info:
  title: Talent Mesh LLM Gateway API
  description: |
    Claude CLI wrapper with session pool management.
    Provides OpenAI-compatible API for future migration flexibility.
    **Note:** Internal service, not exposed publicly.
  version: 1.0.0

servers:
  - url: http://llm-gateway:5005/api/v1
    description: Internal service

tags:
  - name: Chat
    description: OpenAI-compatible chat API
  - name: Sessions
    description: Claude CLI session management
  - name: Health
    description: Service health

paths:
  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: Chat completions (OpenAI-compatible)
      description: |
        OpenAI-compatible chat completions endpoint.
        Internally routes to Claude CLI session pool.
      operationId: chatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '503':
          description: No sessions available

  /generate:
    post:
      tags:
        - Chat
      summary: Simple text generation
      description: Simple prompt-to-response generation
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                system:
                  type: string
                max_tokens:
                  type: integer
                  default: 4096
                temperature:
                  type: number
                  default: 0.7
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  usage:
                    $ref: '#/components/schemas/Usage'

  /sessions:
    get:
      tags:
        - Sessions
      summary: List Claude CLI sessions
      operationId: listSessions
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  pool_size:
                    type: integer
                  available:
                    type: integer
                  busy:
                    type: integer

  /sessions/warmup:
    post:
      tags:
        - Sessions
      summary: Warm up sessions
      description: Pre-warm Claude CLI sessions to reduce latency
      operationId: warmupSessions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  default: 2
      responses:
        '200':
          description: Warmup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  sessions_warming:
                    type: integer

  /sessions/{session_id}:
    get:
      tags:
        - Sessions
      summary: Get session status
      operationId: getSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    delete:
      tags:
        - Sessions
      summary: Kill session
      operationId: killSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session terminated

  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  sessions:
                    type: object
                    properties:
                      total:
                        type: integer
                      healthy:
                        type: integer
                      unhealthy:
                        type: integer
                  latency_ms:
                    type: integer
                    description: Average response latency

components:
  schemas:
    ChatCompletionRequest:
      type: object
      required:
        - messages
      properties:
        model:
          type: string
          default: claude-sonnet
          description: Ignored, always uses Claude via CLI
        messages:
          type: array
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        max_tokens:
          type: integer
          default: 4096
        temperature:
          type: number
          default: 0.7
        stream:
          type: boolean
          default: false

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          default: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/Usage'

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    Session:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [warming, ready, busy, error, terminated]
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
        request_count:
          type: integer
        average_latency_ms:
          type: integer
        error_count:
          type: integer
